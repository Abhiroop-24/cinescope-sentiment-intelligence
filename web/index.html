<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CINESCOPE — Sentiment Intelligence</title>
  <style>
    :root { color-scheme: light; --ink:#111; --muted:#666; --paper:#f7f7f4; }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,sans-serif; }
    main { max-width:980px; margin:auto; padding:48px 22px; } header { display:flex; justify-content:space-between; align-items:start; border-bottom:2px solid; padding-bottom:20px; }
    h1 { font-size:clamp(2.4rem,7vw,5.5rem); line-height:.9; margin:30px 0 14px; letter-spacing:-.07em; } h2 { margin-top:36px; }
    .eyebrow { font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:.75rem; } .muted { color:var(--muted); }
    textarea { width:100%; min-height:190px; padding:18px; border:2px solid var(--ink); background:white; font:inherit; resize:vertical; }
    button { border:2px solid var(--ink); background:var(--ink); color:white; padding:13px 22px; font-weight:700; cursor:pointer; margin-top:12px; }
    button:disabled { opacity:.5; } .result { margin-top:28px; border:2px solid; padding:20px; background:white; display:none; }
    .label { font-size:2rem; font-weight:800; text-transform:uppercase; } .meter { height:10px; background:#ddd; margin:10px 0 18px; } .meter span { display:block; height:100%; background:var(--ink); width:50%; }
    .terms { display:flex; flex-wrap:wrap; gap:8px; } .term { border:1px solid; padding:5px 9px; font-size:.85rem; } footer { margin-top:60px; border-top:1px solid #bbb; padding-top:15px; }
  </style>
</head>
<body><main>
  <header><div class="eyebrow">CINESCOPE / 20</div><div class="muted">PES · UE24CS352A</div></header>
  <h1>What did<br>you think?</h1>
  <p class="muted">An explainable sentiment model trained on the official IMDb Large Movie Review Dataset.</p>
  <form id="form"><textarea id="text" required placeholder="Paste a movie review here…"></textarea><br><button id="submit">ANALYZE REVIEW</button></form>
  <section id="result" class="result" aria-live="polite"><div class="eyebrow">MODEL VERDICT</div><div id="label" class="label"></div><div class="meter"><span id="meter"></span></div><div id="probability" class="muted"></div><h2>Why?</h2><div id="terms" class="terms"></div></section>
  <footer class="muted">TF-IDF + logistic regression · deterministic preprocessing · reproduction attempt of Wu &amp; Shin (2020)</footer>
</main>
<script>
const form=document.querySelector('#form'), text=document.querySelector('#text'), result=document.querySelector('#result');
form.addEventListener('submit', async event => { event.preventDefault(); const button=document.querySelector('#submit'); button.disabled=true; button.textContent='ANALYZING…';
  try { const response=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text.value})}); const data=await response.json(); if(!response.ok) throw Error(data.error);
    result.style.display='block'; document.querySelector('#label').textContent=data.label; document.querySelector('#probability').textContent=`Positive probability: ${(data.probability*100).toFixed(1)}%`; document.querySelector('#meter').style.width=`${data.probability*100}%`;
    document.querySelector('#terms').innerHTML=data.explanation.map(item=>`<span class="term">${item.term} (${item.direction})</span>`).join('');
  } catch(error) { result.style.display='block'; document.querySelector('#label').textContent=error.message; } finally { button.disabled=false; button.textContent='ANALYZE REVIEW'; }
});
</script></body></html>
